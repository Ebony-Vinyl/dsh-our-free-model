<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>启动失败</title>
<style>body{margin:32px;font:16px/1.7 system-ui;background:#0d1117;color:#edf2f8}h1{font-size:22px;color:#00d0c0}p{overflow-wrap:anywhere}small{color:#a8b3c4}</style>
<h1 id="h1">本地服务未能启动</h1><p id="reason">请检查安装是否完整，以及数据目录是否被另一个独立服务占用。</p>
<small id="hint">可从系统托盘退出程序后重试。已有账号和配置会保留。</small>
<script>
(function(){var en=(navigator.language||'').toLowerCase().startsWith('en');if(!en)return;document.documentElement.lang='en';document.title='Startup failed';document.getElementById('h1').textContent='Local service failed to start';document.getElementById('reason').textContent='Check that the installation is complete and the data directory is not in use by another standalone service.';document.getElementById('hint').textContent='Quit from the system tray and retry. Accounts and settings are preserved.';})();
</script></html>
