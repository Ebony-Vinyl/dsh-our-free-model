name: build-macos

# 在 macOS 上构建 Our Free Model 桌面壳的 .dmg（未签名，本地使用需绕过 Gatekeeper）。
# 手动触发，或在打 v* 标签时自动构建并上传为构件。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          npm install
          npm --prefix packages/standalone ci
          node scripts/build-standalone-ui.mjs
          npm --prefix packages/desktop ci --ignore-scripts
      - name: Build macOS dmg
        env:
          CI: true
        run: npm --prefix packages/desktop run build
      - name: Upload dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ofm-desktop-macos
          path: packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Publish dmg as a release asset (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg=$(ls packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          version="${GITHUB_REF_NAME#v}"
          arch=$(uname -m)
          release_tag="${GITHUB_REF_NAME}"
          cat > release-notes.md <<NOTES
          ## macOS 社区构建 / macOS community build

          本 dmg 由本仓库的 GitHub Actions 从公开源码构建，可审计、可复现，未经过 Apple 签名公证。它直接挂到作者发布的主 release（vX.Y.Z），与 Windows 安装包、插件同处一个 release，不再单独开「非官方」release。

          This dmg is built by GitHub Actions from the public, auditable source of this repository and is unsigned / not notarized. It is attached to the same release as the author's Windows installer and plugin (no separate "unofficial" release).

          | 项 / Item | 值 / Value |
          |---|---|
          | 版本 / Version | ${version} |
          | 架构 / Arch | ${arch} |

          ### 可信性 / Trust

          1. 构建来自当前标签对应的公开源码，可逐行审计。
          2. 本 dmg 正是你正在查看的这次 Actions 运行的产物，由 GitHub macOS runner 构建；任何人 fork 后重跑同一 workflow 即可复现。
          3. 下载后请核对下方 SHA256。

          ### 「已损坏」/ "damaged" 怎么办？/ How to open

          本包未经 Apple 签名与公证（社区构建没有 Apple Developer 账号），Gatekeeper 会拦截首次启动，并非文件损坏。任选其一：

          The package is unsigned / not notarized (a community build has no Apple Developer account), so Gatekeeper blocks first launch. The file is NOT damaged. Pick any one:

          1. 访达中右键（Control 点按）应用图标 → 「打开」→ 再次确认。In Finder, Control-click the app → Open → confirm again.
          2. 终端清除隔离属性 / remove the quarantine attribute:

          ```bash
          xattr -cr /Applications/Our\ Free\ Model.app
          ```

          3. 仍提示损坏时用 sudo / if it still complains:

          ```bash
          sudo xattr -rd com.apple.quarantine '/Applications/Our Free Model.app'
          ```

          4. 系统设置 → 隐私与安全性 → 「仍要打开」。System Settings → Privacy & Security → Open Anyway.

          NOTES
          {
            echo ""
            echo "---"
            echo "- 构建来源 / Source: ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
            echo "- 构建记录 / CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- SHA256: $sha"
          } >> release-notes.md
          # 直接挂到作者创建的主 release（vX.Y.Z）；若主 release 尚未生成则等待（最多约 6 分钟）再上传，
          # 避免并发创建重复 release，也消除「非官方社区构建」的独立条目。
          for i in $(seq 1 30); do
            if gh release view "$release_tag" >/dev/null 2>&1; then break; fi
            echo "等待主 release $release_tag 出现… ($i/30)"; sleep 12
          done
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$dmg" --clobber
            echo "已将 dmg 上传到主 release $release_tag"
          else
            # 兜底：主 release 迟迟未出现时自行创建（不再标「非官方」）
            gh release create "$release_tag" "$dmg" \
              --title "Our Free Model ${version} macOS (${arch}) 社区构建 / community build" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
