name: build-windows

# Windows 桌面壳的 NSIS 安装包：与 build-macos.yml 对等的官方 CI 构建。
# 打 v* 标签时自动构建并发布到该标签对应的正式 Release（windows 端的
# "最新产物"由此保证）；也可手动触发，填 releaseTag 即发布到指定 Release，
# 留空则只出构件用于验证。安装包进入 Release 时同步改写 SHA256SUMS 里
# 安装包那一行——桌面应用内更新以 SHA256SUMS 校验安装包。
#
# 与 build-macos 不同：仓库 vendor/magpie/engine.json 只记录 win32-x64，
# Windows runner 直接使用随树分发的引擎二进制，无需构建 darwin 引擎。

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 发布安装包到哪个 Release（留空仅构建构件）
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          npm install
          npm --prefix packages/standalone ci
          node scripts/build-standalone-ui.mjs
          npm --prefix packages/desktop ci --ignore-scripts
      - name: Build Windows NSIS installer
        env:
          CI: true
        run: npm --prefix packages/desktop run build
      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ofm-desktop-windows
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Publish installer as a release asset (tag builds or dispatched releaseTag)
        if: startsWith(github.ref, 'refs/tags/') || inputs.releaseTag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.releaseTag }}
        shell: bash
        run: |
          set -euo pipefail
          exe=$(ls packages/desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          version=$(node -p "require('./packages/desktop/package.json').version")
          asset="Our.Free.Model_${version}_x64-setup.exe"
          cp "$exe" "$asset"
          sha=$(sha256sum "$asset" | awk '{print $1}')
          # 改写 SHA256SUMS：只替换安装包那一行，其余资产的哈希保持原样。
          gh release download "$RELEASE_TAG" -p SHA256SUMS -O SHA256SUMS.prev || true
          if [ -f SHA256SUMS.prev ]; then
            grep -v 'setup\.exe' SHA256SUMS.prev > SHA256SUMS || true
            rm SHA256SUMS.prev
          else
            : > SHA256SUMS
          fi
          echo "$sha *$asset" >> SHA256SUMS
          gh release upload "$RELEASE_TAG" "$asset" SHA256SUMS --clobber
          echo "published $asset ($sha) to $RELEASE_TAG"
