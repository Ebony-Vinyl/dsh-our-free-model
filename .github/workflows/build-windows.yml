name: build-windows

# 在 Windows 上构建 Our Free Model 桌面壳的 .exe 安装包（未签名，需绕过 SmartScreen）。
# 手动触发，或在打 v* 标签时自动构建并发布为 vX.Y.Z-windows-unofficial。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/standalone ci
          node scripts/build-standalone-ui.mjs
          npm --prefix packages/desktop ci --ignore-scripts
      - name: Build Windows installer
        env:
          CI: true
        run: npm --prefix packages/desktop run build
      - name: Publish installer as a release asset (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer=$(ls packages/desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          sha=$(sha256sum "$installer" | awk '{print $1}')
          version=$(node -p "require('./packages/desktop/package.json').version")
          release_tag="${GITHUB_REF_NAME}-windows-unofficial"
          cat > release-notes.md <<NOTES
          ## 非官方社区构建 / Unofficial community build (Windows)

          这不是仓库作者发布的官方安装包；本 .exe 由本仓库的 GitHub Actions 从公开源码构建，可审计、可复现。安装包未经 Authenticode 签名，Windows SmartScreen 可能拦截，并非文件损坏。

          This is NOT an official release. The .exe is built by GitHub Actions from public, auditable source. It is not Authenticode-signed, so SmartScreen may block first launch — the file is NOT damaged.

          | 项 / Item | 值 / Value |
          |---|---|
          | 版本 / Version | ${version} |
          | 架构 / Arch | x64 |

          ### 如何安装 / How to install

          1. 运行 \`Our Free Model_x64-setup.exe\`，按提示安装。Run the installer and follow the prompts.
          2. 若被 SmartScreen 拦截：「更多信息」→「仍要运行」。If SmartScreen blocks it: More info → Run anyway.
          3. 安装前请从托盘完全退出旧程序，配置与账号数据会被保留。Fully quit the old app from the tray before installing; config and accounts are preserved.

          ### 可信性 / Trust

          - 构建来自当前标签对应的公开源码，可逐行审计。
          - 本 .exe 正是你正在查看的这次 Actions 运行的产物，由 GitHub Windows runner 构建；任何人 fork 后重跑同一 workflow 即可复现。
          - 下载后请核对下方 SHA256。
          NOTES
          {
            echo ""
            echo "---"
            echo "- 构建来源 / Source: ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
            echo "- 构建记录 / CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- SHA256: $sha"
          } >> release-notes.md
          gh release create "$release_tag" "$installer" \
            --title "${version} Windows (x64) — 非官方社区构建 / unofficial community build" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" || gh release upload "$release_tag" "$installer" --clobber
